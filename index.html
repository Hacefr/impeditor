<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImpStudio - Web Rhythm Engine</title>
  <link rel="stylesheet" href="style.css" />

  <!-- External Libraries (CDN for Zero-Install GitHub Pages) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

  <!-- Hidden Code-Generated SVG Asset Library (Zero external image files) -->
  <svg style="display: none;">
    <defs>
      <!-- Base Receptor Arrow (Gray Outline) -->
      <g id="svg-arrow-receptor">
        <path d="M25 5 L45 25 L35 25 L35 45 L15 45 L15 25 L5 25 Z" fill="none" stroke="#555" stroke-width="4" stroke-linejoin="round"/>
      </g>
      <!-- Note Arrow Template (Filled) -->
      <g id="svg-arrow-note">
        <path d="M25 5 L45 25 L35 25 L35 45 L15 45 L15 25 L5 25 Z" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      </g>
    </defs>
  </svg>

  <div id="app-container">

    <!-- SCREEN 1: FREEPLAY MENU -->
    <section id="screen-freeplay" class="screen active">
      <!-- Top Folder / Squares Bar -->
      <header class="folder-bar">
        <div id="folder-list" class="folder-tabs-wrapper">
          <!-- Folders injected via JS -->
          <button class="folder-tab active" data-folder="DEFAULT">MAIN</button>
        </div>
        <button id="btn-add-folder" class="folder-tab btn-icon" title="Add Folder">+</button>
      </header>

      <!-- Main Freeplay Body -->
      <main class="freeplay-content">
        <!-- Left: Song Capsules -->
        <div class="song-column">
          <div id="song-list" class="song-list-wrapper">
            <!-- Dynamic song capsules injected via JS -->
          </div>
          <button id="btn-open-add-song" class="btn-capsule btn-action-capsule">+ ADD SONG</button>
        </div>

        <!-- Right: Showcase / Banner Card -->
        <aside class="showcase-card">
          <div id="showcase-banner" class="banner-area">
            <span class="banner-placeholder">No Banner Art Selected</span>
          </div>
          <div class="showcase-meta">
            <div class="difficulty-selector">
              <button id="diff-prev" class="btn-arrow">&lt;</button>
              <span id="diff-label">HARD</span>
              <button id="diff-next" class="btn-arrow">&gt;</button>
            </div>
            <div class="action-buttons">
              <button id="btn-play-song" class="btn-bold btn-primary">PLAY</button>
              <button id="btn-modify-song" class="btn-bold btn-secondary">MODIFY</button>
            </div>
          </div>
        </aside>
      </main>

      <!-- Bottom Status / Engine Bar -->
      <footer class="bottom-bar">
        <button id="btn-open-main-files" class="btn-flat">Menu &gt; Main Files</button>
        <div id="engine-status">Engine Ready • Pure Code Mode</div>
      </footer>
    </section>

    <!-- SCREEN 2: GAMEPLAY & STUDIO VIEWPORT (Hidden by default) -->
    <section id="screen-game" class="screen">
      <!-- PixiJS Canvas Appends Here -->
      <div id="canvas-container"></div>

      <!-- Studio Mode: Director UI Overlay -->
      <div id="studio-ui" class="studio-overlay hidden">
        <!-- Top Toolbar -->
        <div class="studio-topbar">
          <span class="studio-title">STUDIO / DIRECTOR MODE</span>
          <button id="btn-exit-studio" class="btn-bold">EXIT</button>
        </div>

        <!-- Middle: Properties Inspector (Right) -->
        <aside class="inspector-panel">
          <h3>PROPERTIES</h3>
          <div id="inspector-content">Select an object on stage...</div>
        </aside>

        <!-- Bottom: GD-Style Timeline -->
        <div class="timeline-container">
          <div class="timeline-controls">
            <button id="timeline-play">▶</button>
            <span id="timeline-time">00:00.000</span>
            <button id="btn-add-trigger" class="btn-bold">+ TRIGGER</button>
          </div>
          <div id="timeline-track" class="timeline-track">
            <div id="timeline-playhead" class="playhead"></div>
            <!-- Trigger markers injected via JS -->
          </div>
        </div>
      </div>
    </section>

    <!-- MODAL 1: ADD SONG (Quick Ingest) -->
    <div id="modal-add-song" class="modal-backdrop hidden">
      <div class="modal-box">
        <h2 class="modal-title">ADD SONG</h2>

        <div class="field-row">
          <select id="add-song-folder-select" class="input-select">
            <option value="DEFAULT">select square...</option>
          </select>
          <button id="btn-quick-add-folder" class="btn-square">+</button>
        </div>

        <p class="field-label">Upload files... (song data, song inst, and voices)</p>
        <div id="drop-zone-add-song" class="drop-zone">
          <p class="drop-text">Drag & Drop files here or click to browse</p>
          <div id="file-check-list" class="check-list"></div>
          <input type="file" id="file-input-add-song" multiple hidden />
        </div>

        <div class="modal-actions">
          <button id="btn-add-song-done" class="btn-bold">Done</button>
          <button id="btn-add-song-cancel" class="btn-bold">cancel.</button>
        </div>
      </div>
    </div>

    <!-- MODAL 2: MODIFY SONG DETAILS -->
    <div id="modal-modify-song" class="modal-backdrop hidden">
      <div class="modal-box modal-large">
        <div class="modal-header-split">
          <div>
            <h2 class="modal-title">Modifying song details...</h2>
            <p class="subhead">Current folder/square: <strong id="mod-folder-name">'MY-MIX'</strong> <button id="btn-change-folder" class="btn-inline">Change?</button></p>
          </div>
          <button id="btn-goto-studio" class="btn-highlight">
            Click here to modify stage,<br>props, triggers, positions ECT...
          </button>
        </div>

        <div class="modify-body">
          <div class="files-manager">
            <label class="field-label">Files:</label>
            <div id="mod-files-list" class="list-box"></div>
            <div class="manager-btns">
              <button id="btn-mod-file-add" class="btn-bold">ADD</button>
              <button id="btn-mod-file-rem" class="btn-bold">REM.</button>
            </div>
          </div>
        </div>

        <div class="modify-footer">
          <input type="text" id="mod-song-name-input" class="input-text" placeholder="Song Name" />
          <button id="mod-song-icon-btn" class="icon-square" title="Click to set icon">X</button>
          <button id="btn-mod-done" class="btn-bold">DONE</button>
          <button id="btn-mod-back" class="btn-bold">BACK</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Entry Script (ES Modules) -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
